### SMOKE TEST: verifies the training pipeline runs end-to-end on CPU with
### a tiny slice of data. Not meant to converge or produce a useful model --
### see config/train.yaml for the real end2end config this is derived from.

parameters:

  MODEL:
    value:
      MODEL_CLASS: "UnReflect_Model_TokenInpainter"
      MODEL_MODULE: "models"
      RGB_ENCODER:
        # facebook/dinov3-vitl16-pretrain-lvd1689m is gated on HF (needs an
        # account + accepted license + HF_TOKEN); using the public mirror the
        # PyPI inference package itself substitutes automatically avoids that.
        ENCODER: "AlbeRota/DINOv3_mirror"
        # Small on purpose: at 896 DINOv3 emits 56x56=3136 patch tokens, and
        # the resulting attention matrices retained for backprop across the
        # inpainter's 6 layers appear to exhaust RAM in a way that segfaults
        # (access violation) rather than raising a clean OOM error -- crashed
        # identically under nn.MultiheadAttention, fused SDPA, and even SDPA's
        # unfused math backend. 224 -> 14x14=196 tokens, ~250x smaller
        # attention matrices. This is a pipeline smoke test, not a real run.
        IMAGE_SIZE: 224
        RETURN_SELECTED_LAYERS: [3, 6, 9, 12]
        RGB_ENCODER_LR: 0.0
      DECODERS:
        diffuse:
          FEATURE_DIM: 1024
          REASSEMBLE_OUT_CHANNELS: [768,1024,1536,2048]
          REASSEMBLE_FACTORS: [4.0, 2.0, 1.0, 0.5]
          READOUT_TYPE: "ignore"
          # Not loading the pretrained checkpoint here: it was trained at
          # 896x896 and its weights won't shape-match at 224x224.
          USE_BN: False
          DROPOUT: 0.1
          OUTPUT_IMAGE_SIZE: [224,224]
          OUTPUT_CHANNELS: 3
          DECODER_LR: 0.0
          NUM_FUSION_BLOCKS_TRAINABLE: 1
          TRAIN_RGB_HEAD: True
        highlight:
          FEATURE_DIM: 1024
          REASSEMBLE_OUT_CHANNELS: [96,192,384,768]
          REASSEMBLE_FACTORS: [4.0, 2.0, 1.0, 0.5]
          READOUT_TYPE: "ignore"
          USE_BN: False
          DROPOUT: 0.1
          OUTPUT_IMAGE_SIZE: [224,224]
          OUTPUT_CHANNELS: 1
          DECODER_LR: 5.0e-4
          NUM_FUSION_BLOCKS_TRAINABLE: null
      TOKEN_INPAINTER:
        TOKEN_INPAINTER_CLASS: "TokenInpainter_Prior"
        TOKEN_INPAINTER_MODULE: "token_inpainters"
        TOKEN_INPAINTER_LR: 1.0e-4
        DEPTH: 6
        HEADS: 16
        DROP: 0.05
        USE_POSITIONAL_ENCODING: True
        USE_FINAL_NORM: True
        USE_LOCAL_PRIOR: True
        LOCAL_PRIOR_WEIGHT: 0.5
        LOCAL_PRIOR_KERNEL: 5
        SEED_NOISE_STD: 0.02
  INPAINT_MASK_DILATION:
    value: 3
  # Missing from the real train.yaml too (DotMap silently returns an empty
  # object for undefined keys instead of erroring, which crashes downstream
  # with "'>' not supported between Tensor and DotMap") -- value from
  # highlight_decoder_pretrain.yaml, which does set it.
  INPAINT_MASK_THRESHOLD:
    value: 0.2
  USE_TORCH_COMPILE:
    value: False
  DISTRIBUTE:
    value: "singlegpu"

  ### DATA -- PSD only (the only fully-downloaded dataset this repo's own
  ### wrappers.py config also references for training, not just eval), few_images
  ### caps it to a handful of samples so this finishes on CPU.
  DATASETS:
    value:
      PSD:
        TRAIN_SCENES: "PSD_Train"
        VAL_SCENES: "PSD_Val"
        TARGET_SIZE: [224,224]
        RESIZE_MODE: "resize+crop"
        SAMPLE_EVERY_N: 1
        LOAD_RGB_ONLY: True
        FEW_IMAGES: True
  FEW_IMAGES_ALL_DATASETS:
    value: True

  BATCH_SIZE:
    value: 1
  NUM_WORKERS:
    value: 0
  SHUFFLE:
    value: True
  PIN_MEMORY:
    value: False
  PREFETCH_FACTOR:
    value: null

  ### HIGHLIGHTS (VHS synthesis params, unchanged from train.yaml)
  MOGE_MODEL:
    value: "Ruicheng/moge-2-vits-normal"
  SURFACE_ROUGHNESS:
    value: 8.0
  INTENSITY:
    value: 2.0
  LIGHT_DISTANCE_RANGE:
    value: [0.0, 1]
  LIGHT_LEFT_RIGHT_ANGLE:
    value: [0, 360]
  LIGHT_ABOVE_BELOW_ANGLE:
    value: [0, 360]
  DATASET_HIGHLIGHT_DILATION:
    value: 25
  DATASET_HIGHLIGHT_THRESHOLD:
    value: 0.9
  DATASET_HIGHLIGHT_USE_LUMINANCE:
    value: True
  HIGHLIGHT_COLOR:
    value: [1.0, 1.0, 1.0]
  CLAMP_RECONSTRUCTION:
    value: True

  ### OPTIMIZATION -- trimmed to run fast
  LEARNING_RATE:
    value: 1.0e-3
  WEIGHT_DECAY:
    value: 0.0
  EPOCHS:
    value: 1
  GRADIENT_ACCUMULATION_STEPS:
    value: 1
  WARMUP:
    value: 0
  GRADIENT_CLIPPING_MAX_NORM:
    value: 8
  LR_SCHEDULER:
    value:
      ONPLATEAU:
        PATIENCE: 5
        FACTOR: 0.1
      STEPWISE:
        N_STEPS: 4
        GAMMA: 0.5

  SWITCH_OPTIMIZER_EPOCH:
    value: null
  OPTIMIZER_BOOTSTRAP_NAME:
    value: "AdamW"
  OPTIMIZER_REFINING_NAME:
    value: "AdamW"
  EARLY_STOPPING_PATIENCE:
    value: 10
  SAVE_INTERVAL:
    value: 1000000

  DATASET_HIGHLIGHT_SUPERVISION_THRESHOLD:
    value: 0.1

  ### LOSS WEIGHTS (unchanged from train.yaml)
  SPECULAR_LOSS_WEIGHT:
    value: 0.0
  DIFFUSE_LOSS_WEIGHT:
    value: 0.0
  HIGHLIGHT_LOSS_WEIGHT:
    value: 1.0
  TOKEN_INPAINT_LOSS_WEIGHT:
    value: 1.0
  IMAGE_RECONSTRUCTION_LOSS_WEIGHT:
    value: 0.0
  SATURATION_RING_LOSS_WEIGHT:
    value: 0.0
  WEIGHT_CONTEXT_IDENTITY:
    value: 0.0
  WEIGHT_TV_IN_HOLE:
    value: 0.0
  RING_KERNEL_SIZE:
    value: 11
  RING_VAR_WEIGHT:
    value: 0.5
  RING_TEXTURE_WEIGHT:
    value: 1.0
  HLREG_W_L1:
    value: 1.0
  HLREG_USE_CHARB:
    value: True
  HLREG_W_DICE:
    value: 0.2
  HLREG_W_SSIM:
    value: 0.0
  HLREG_W_GRAD:
    value: 0.0
  HLREG_W_TV:
    value: 0.0
  HLREG_BALANCE_MODE:
    value: "auto"
  HLREG_POS_WEIGHT:
    value: 1.0
  HLREG_FOCAL_GAMMA:
    value: 2.0
  RING_DILATE_KERNEL:
    value: 17
  WEIGHT_SEAM:
    value: 0.5
  SEAM_USE_CHARB:
    value: True
  SEAM_WEIGHT_GRAD:
    value: 0.0
  TOKEN_FEAT_ALPHA:
    value: 0.5

  WEIGHT_DIFFUSE_HIGHLIGHT_PENALTY:
    value: 0.1
  DIFFUSE_HL_THRESHOLD:
    value: 0.85
  DIFFUSE_HL_USE_CHARB:
    value: True
  DIFFUSE_HL_PENALTY_MODE:
    value: "brightness"
  DIFFUSE_HL_TARGET_BRIGHTNESS:
    value: null
  DIFFUSE_HL_USE_LUMINANCE:
    value: False

  ### LOGGING -- wandb disabled for the smoke test
  LOG_INTERVAL:
    value: 1
  WANDB_LOG_INTERVAL:
    value: 1
  IMAGE_LOG_INTERVAL:
    value: 5
  NO_WANDB:
    value: True
  MODEL_WATCHER_FREQ_WANDB:
    value: 50
  WANDB_ENTITY:
    value: "unreflect-anything"
  WANDB_PROJECT:
    value: "UnReflectAnything"
  NOTES:
    value: "CPU smoke test"
